# NGINX Reverse Proxy Configuration for OpenWebUI + LiteLLM
# SSL configuration based on Mozilla SSL Generator (Intermediate)
#
# Replace chat.example.edu and litellm.example.edu with your actual domains.

# Docker DNS resolver - re-resolves hostnames every 10s so nginx picks up
# new container IPs after restarts (prevents stale 502s)
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

# Performance logging — includes upstream response time and request duration.
# Use with: docker logs chat-nginx | grep 'rt=' to spot slow requests.
# Fields: $request_time = total nginx handling time (s),
#         $upstream_response_time = time waiting for backend (s),
#         $upstream_connect_time = TCP connect to backend (s)
log_format timed '$remote_addr - $remote_user [$time_local] '
                 '"$request" $status $body_bytes_sent '
                 '"$http_referer" "$http_user_agent" '
                 'rt=$request_time urt=$upstream_response_time '
                 'uct=$upstream_connect_time';

access_log /var/log/nginx/access.log timed;

# HTTP -> HTTPS redirect (both domains)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name chat.example.edu litellm.example.edu litellmmanager.example.edu;

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server for OpenWebUI (chat.example.edu) - default server
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name chat.example.edu;

    # Security headers ("always" so they're also sent on redirects/errors)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # SSL Configuration
    ssl_certificate /etc/nginx/ssl/chat.crt;
    ssl_certificate_key /etc/nginx/ssl/chat.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_session_tickets off;

    # Intermediate SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/javascript application/json application/xml text/xml application/xml+rss text/javascript;

    # Max upload size (for file attachments)
    client_max_body_size 50M;

    # Increase body buffer to avoid disk temp files for chat history
    client_body_buffer_size 256k;

    # Proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket support
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400;

    # Dashboard service (must be BEFORE catch-all /)
    location /dashboard {
        set $upstream_dashboard http://dashboard:8000;

        # Strip /dashboard prefix when proxying
        # /dashboard/health -> /health
        # /dashboard/static/js/app.js -> /static/js/app.js
        rewrite ^/dashboard(.*)$ $1 break;

        proxy_pass $upstream_dashboard;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /dashboard;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # OpenWebUI (all traffic)
	# Added subfilter for first access AUP
	# Adjust the background and AUP policy URLS in the subfilter before using.
    location / {
        set $upstream_openwebui http://openwebui:8080;
        proxy_pass $upstream_openwebui;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_set_header Accept-Encoding "";

        # Add these — essential for OAuth redirect/claim URLs
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket support (OpenWebUI needs this)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_http_version 1.1;
        sub_filter_once on;
        sub_filter '</body>' '<style>#aup-overlay{position:fixed;inset:0;z-index:999999;background:#0f0f0f url("https://i.imgur.com/h5jcoc2.jpeg") center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-family:system-ui,-apple-system,sans-serif}#aup-overlay .aup-box{max-width:720px;width:90%;max-height:80vh;overflow-y:auto;background:rgba(27,27,27,.92);color:#f5f5f5;border:1px solid #333;border-radius:12px;padding:32px;backdrop-filter:blur(4px)}#aup-overlay h1{font-size:1.4rem;margin-bottom:16px}#aup-overlay p{line-height:1.6;margin-bottom:12px;font-size:.95rem}#aup-overlay button{margin-top:20px;padding:12px 28px;font-size:1rem;border:none;border-radius:8px;background:#2563eb;color:#fff;cursor:pointer}#aup-overlay button:hover{background:#1d4ed8}</style><div id="aup-overlay" role="dialog" aria-modal="true"><div class="aup-box"><h1>Welcome to Bruin-AI</h1><p>Be respectful and don\'t break the law. Our platform is for constructive use; any behavior that harms others, disrupts services, or violates legal standards is prohibited.</p><p>For complete legal details regarding your rights and our obligations, please review the full versions of our policies below:</p><p><a href="https://frsecure.com/acceptable-use-policy-template/" style="color: #109AD6;">Acceptable Use</a></p><button id="aup-agree" style="float:right;">I Agree</button></div></div><script>(function(){var K="aup-accepted-v1",o=document.getElementById("aup-overlay");if(localStorage.getItem(K)==="yes"){o.remove();return}document.body.style.overflow="hidden";document.getElementById("aup-agree").addEventListener("click",function(){localStorage.setItem(K,"yes");document.body.style.overflow="";o.remove()})})();</script></body>';
    }
}

# HTTPS server for LiteLLM Admin UI (litellm.example.edu)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name litellm.example.edu;

    # Security headers ("always" so they're also sent on redirects/errors)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # SSL Configuration (same cert with SAN)
    ssl_certificate /etc/nginx/ssl/chat.crt;
    ssl_certificate_key /etc/nginx/ssl/chat.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_session_tickets off;

    # Intermediate SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/javascript application/json application/xml text/xml application/xml+rss text/javascript;

    # Max upload size
    client_max_body_size 50M;

    # Proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket support
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400;

    # Redirect root to admin UI
    location = / {
        return 302 /ui/;
    }

    # Block external access to Prometheus metrics
    location = /metrics {
        return 403;
    }

    # Grafana monitoring dashboards (optional — see monitoring/README.md)
    location /grafana/ {
        set $upstream_grafana http://grafana:3000;
        proxy_pass $upstream_grafana;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # LiteLLM (all traffic)
    location / {
        set $upstream_litellm http://litellm:4000;
        proxy_pass $upstream_litellm;
        proxy_redirect http:// https://;
    }
}

